name: Build Userscripts
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-userscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '26.5.0'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm ci

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: Typecheck with tsc
        run: |
          pnpm tsc --noEmit

      - name: Build
        run: pnpm webpack

        # Sometimes webpack removes the metadata
        # even though it shouldn't
      - name: Check metadata of output
        run: node scripts/check-metadata.js

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: dist
          path: dist

  upload:
    runs-on: ubuntu-latest
    needs: build-userscripts
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Write ssh key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ssh-key
          chmod 600 ~/.ssh/ssh-key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
      - name: Sync dist
        run: |
          # Trust host public key
          echo "${{ secrets.SSH_HOST }} ${{ secrets.SSH_HOST_KEY }}" >> ~/.ssh/known_hosts
          ssh-keygen -Hf ~/.ssh/known_hosts

          rsync --verbose --human-readable --archive \
            --checksum --delete \
            -e "ssh -i ~/.ssh/ssh-key" \
            . "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST}}:/var/www/eth-userscripts/"
      - run: rm ~/.ssh/ssh-key
        if: always()
