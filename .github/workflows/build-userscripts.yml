name: Build Userscripts
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-userscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@v26.5.0

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: Typecheck with tsc
        run: |
          pnpm typecheck

      - name: Build
        run: pnpm esbuild

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          name: dist
          path: dist

  upload:
    runs-on: ubuntu-latest
    needs: build-userscripts
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
      - name: Sync dist
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT INT TERM
          printf '%s\n' "$SSH_KEY" | ssh-add -t 300 -

          rsync --verbose --human-readable --archive \
            --checksum --delete \
            --rsh "ssh -o StrictHostKeyChecking=yes" \
            . "$SSH_USERNAME@$SSH_HOST:/"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
